<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadow Card - Game Thẻ Bài</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- MÀN HÌNH 1: SẢNH CHỜ CHÍNH -->
  <div id="screen-main" class="game-screen bg-main">
    <div class="top-controls">
      <button class="icon-btn">🔊</button>
      <button class="icon-btn">⚙️</button>
    </div>

    <!-- Vùng nút bấm bên trái (Đăng nhập / Đăng ký) -->
    <div class="left-action-buttons">
      <button id="btn-to-login" class="invisible-btn login-pos"></button>
      <button id="btn-to-register" class="invisible-btn reg-pos"></button>
    </div>

    <!-- Vùng nút Tap to Start -->
    <div class="tap-start-container">
      <button id="btn-tap-start" class="invisible-btn start-pos"></button>
    </div>
  </div>

  <!-- MÀN HÌNH 2: ĐĂNG KÝ -->
  <div id="screen-register" class="game-screen bg-register hidden">
    <button class="back-btn" id="btn-back-from-reg"></button>
    
    <!-- Form nhập thông tin đè lên ảnh Đăng Ký -->
    <form class="overlay-form form-reg-pos" onsubmit="return false;">
      <input type="text" class="input-transparent" placeholder="" required>
      <input type="password" class="input-transparent" placeholder="" required>
      <button type="submit" class="btn-submit-overlay"></button>
    </form>

    <button id="link-reg-to-login" class="switch-btn-overlay"></button>
  </div>

  <!-- MÀN HÌNH 3: ĐĂNG NHẬP -->
  <div id="screen-login" class="game-screen bg-login hidden">
    <button class="back-btn" id="btn-back-from-login"></button>

    <!-- Form nhập thông tin đè lên ảnh Đăng Nhập -->
    <form class="overlay-form form-login-pos" onsubmit="return false;">
      <input type="text" class="input-transparent" placeholder="" required>
      <input type="password" class="input-transparent" placeholder="" required>
      <button type="submit" class="btn-submit-overlay"></button>
    </form>

    <button id="link-login-to-reg" class="switch-btn-overlay"></button>
  </div>

  <script src="script.js"></script>
</body>
</html>
