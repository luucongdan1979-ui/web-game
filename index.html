<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadow Card - Game Thẻ Bài</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- MÀN HÌNH CHÍNH -->
  <div id="screen-main" class="game-box">
    <h1>Shadow Card</h1>
    <button id="to-reg-btn" class="main-btn">Đăng Ký Tài Khoản</button>
  </div>

  <!-- MÀN HÌNH ĐĂNG KÝ -->
  <div id="screen-register" class="game-box hidden">
    <h2>Đăng Ký</h2>
    <input type="text" id="username" placeholder="Nhập tên tài khoản của bạn...">
    <button id="submit-reg-btn" class="main-btn">Xác Nhận Đăng Ký</button>
  </div>

  <!-- MÀN HÌNH SẢNH GAME & RƯƠNG BÁU -->
  <div id="screen-lobby" class="game-box hidden">
    <h2>Xin chào, <span id="name-output">Tân Thủ</span>!</h2>
    <p>🎉 Đăng ký thành công! Bạn nhận được 1 Rương Báu!</p>
    
    <!-- RƯƠNG BÁU -->
    <div id="chest-box" class="interactive-item">🧰 Bấm vào đây để mở Rương</div>
    
    <!-- GÓI THẺ -->
    <div id="pack-box" class="interactive-item hidden">📦 Bấm vào đây để xé Gói Thẻ</div>
    
    <!-- LÁ BÀI KHÁ BẢNH -->
    <div id="card-box" class="hidden">
      <img src="khá bảnh nv.png" alt="Khá Bảnh" class="card-img">
      <h3>✨ LÁ BÀI HUYỀN THOẠI: KHÁ BẢNH ✨</h3>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
