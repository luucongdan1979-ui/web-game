<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Thẻ Bài Meme</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <!-- MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ / ADMIN -->
    <div id="auth-screen" class="screen">
        <div class="auth-container">
            <h2>Game Thẻ Bài Meme</h2>
            
            <div class="tab-buttons">
                <button onclick="switchTab('login')" class="tab-btn active">Đăng Nhập</button>
                <button onclick="switchTab('register')" class="tab-btn">Đăng Ký</button>
                <button onclick="switchTab('admin')" class="tab-btn">Admin Code</button>
            </div>

            <!-- Form Đăng Nhập -->
            <div id="login-form" class="form-box active">
                <input type="text" id="login-user" placeholder="Tên tài khoản">
                <input type="password" id="login-pass" placeholder="Mật khẩu">
                <button onclick="handleLogin()">Đăng Nhập</button>
            </div>

            <!-- Form Đăng Ký -->
            <div id="register-form" class="form-box">
                <input type="text" id="reg-user" placeholder="Tên tài khoản">
                <input type="email" id="reg-email" placeholder="Gmail">
                <input type="password" id="reg-pass" placeholder="Mật khẩu">
                <button onclick="handleRegister()">Đăng Ký</button>
            </div>

            <!-- Form Admin Code -->
            <div id="admin-form" class="form-box">
                <input type="password" id="admin-code-input" placeholder="Nhập mã admin 6 số (171113)" maxlength="6">
                <button onclick="handleAdminLogin()">Đăng Nhập Admin</button>
            </div>
        </div>
    </div>

    <!-- MÀN HÌNH CHÍNH (GAME) -->
    <div id="main-screen" class="screen hidden">
        <!-- Rương tân thủ (Popup giữa màn hình) -->
        <div id="beginner-chest-modal" class="modal">
            <div class="modal-content">
                <h3>🎁 Rương Tân Thủ</h3>
                <p>Nhấn vào rương để mở gói quà đầu tiên!</p>
                <div id="chest-box" onclick="openChest()">📦 Mở Rương</div>
                <div id="reward-result" class="hidden">
                    <p>Bạn nhận được lá bài:</p>
                    <img id="reward-img" src="" alt="Thẻ bài">
                    <h4 id="reward-name"></h4>
                    <button onclick="closeChestModal()">Vào Game</button>
                </div>
            </div>
        </div>

        <div class="game-content">
            <h1>Sảnh Chính</h1>
            <p>Chào mừng bạn đến với thế giới thẻ bài meme!</p>
        </div>

        <!-- Thanh Taskbar ở dưới -->
        <div class="taskbar">
            <button onclick="openShop()">🛒 Shop</button>
            <button onclick="openAlbum()">🃏 Album</button>
            <button onclick="logout()">🚪 Đăng Xuất</button>
        </div>
    </div>

    <script src="scripts/scripts.js"></script>
</body>
</html>
