
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARD ARENA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="background-effects">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>

  <main class="welcome-screen">
    <div class="logo">CA</div>

    <h1 class="game-title">CARD ARENA</h1>
    <p class="subtitle">COLLECT YOUR POWER · RULE THE ARENA</p>

    <div class="card-decorations">
      <div class="mini-card card-left">♠</div>
      <div class="mini-card card-center">★</div>
      <div class="mini-card card-right">♦</div>
    </div>

    <button id="tapStartBtn" class="tap-start">
      TAP TO START
    </button>

    <p class="hint">Chạm để bước vào thế giới thẻ bài</p>

    <div class="main-buttons">
      <button id="loginBtn" class="btn btn-primary">
        ĐĂNG NHẬP
      </button>

      <button id="registerBtn" class="btn btn-secondary">
        ĐĂNG KÝ
      </button>
    </div>

    <button id="adminBtn" class="admin-button">
      ⚙ ADMIN ACCESS
    </button>

    <p class="copyright">CARD ARENA © 2026</p>
  </main>

  <!-- Hộp đăng nhập / đăng ký -->
  <div id="authModal" class="modal hidden">
    <div class="modal-box">
      <button class="close-btn" data-close="authModal">✕</button>

      <div class="modal-logo">CA</div>
      <h2 id="authTitle">ĐĂNG NHẬP</h2>
      <p id="authDescription">Chào mừng trở lại đấu trường!</p>

      <form id="authForm">
        <label for="username">Tên tài khoản</label>
        <input
          id="username"
          type="text"
          placeholder="Nhập tên tài khoản"
          minlength="3"
          required
          autocomplete="username"
        >

        <div id="emailGroup" class="hidden">
          <label for="email">Gmail</label>
          <input
            id="email"
            type="email"
            placeholder="example@gmail.com"
            autocomplete="email"
          >
        </div>

        <label for="password">Mật khẩu</label>
        <input
          id="password"
          type="password"
          placeholder="Nhập mật khẩu"
          minlength="4"
          required
          autocomplete="current-password"
        >

        <div id="confirmGroup" class="hidden">
          <label for="confirmPassword">Xác nhận mật khẩu</label>
          <input
            id="confirmPassword"
            type="password"
            placeholder="Nhập lại mật khẩu"
            minlength="4"
            autocomplete="new-password"
          >
        </div>

        <button type="submit" id="submitAuth" class="btn btn-primary full-btn">
          ĐĂNG NHẬP
        </button>
      </form>

      <p class="switch-text">
        <span id="switchDescription">Chưa có tài khoản?</span>
        <button id="switchAuthBtn">Đăng ký ngay</button>
      </p>
    </div>
  </div>

  <!-- Hộp đăng nhập Admin -->
  <div id="adminModal" class="modal hidden">
    <div class="modal-box admin-box">
      <button class="close-btn" data-close="adminModal">✕</button>

      <div class="modal-logo admin-logo">⚙</div>
      <h2>ADMIN ACCESS</h2>
      <p>Khu vực dành riêng cho quản trị viên</p>

      <form id="adminForm">
        <label for="adminUsername">Tên tài khoản Admin</label>
        <input
          id="adminUsername"
          type="text"
          placeholder="Nhập tên Admin"
          required
        >

        <label for="adminPassword">Mật khẩu Admin</label>
        <input
          id="adminPassword"
          type="password"
          placeholder="Nhập mật khẩu Admin"
          required
        >

        <button type="submit" class="btn btn-admin full-btn">
          ĐĂNG NHẬP ADMIN
        </button>
      </form>
    </div>
  </div>

  <!-- Thông báo -->
  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
