<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Arena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- MÀN HÌNH CHÀO -->
  <div class="welcome-screen" id="welcomeScreen">
    <div class="logo-container">
      <div class="logo-icon">CA</div>
    </div>
    <p class="subtitle">THE ULTIMATE CARD COLLECTION</p>
    <h1>CARD ARENA</h1>
    <p class="description">Sưu tầm thẻ bài • Mở pack • Khám phá huyền thoại</p>
    
    <div class="welcome-actions">
      <button class="primary-btn" id="openAuthModalBtn">ĐĂNG NHẬP</button>
      <button class="secondary-btn" id="openRegisterModalBtn">ĐĂNG KÝ</button>
    </div>

    <button class="start-btn" id="tapToStartBtn">TAP TO START</button>
    
    <button class="admin-link-btn" id="openAdminModalBtn">👑 ADMIN ACCESS</button>
    <p class="footer-text">CARD ARENA – COLLECT YOUR LEGEND</p>
  </div>

  <!-- HỘP ĐĂNG NHẬP / ĐĂNG KÝ (Đảm bảo chỉ có class "modal", KHÔNG CÓ "show") -->
  <div class="modal" id="authModal">
    <div class="modal-box auth-box">
      <button class="close-btn" data-close="authModal" aria-label="Đóng">✕</button>
      <p class="eyebrow">WELCOME TO CARD ARENA</p>
      <h2 id="authTitle">ĐĂNG NHẬP</h2>

      <form id="authForm">
        <label for="authUsername">Tên tài khoản</label>
        <input id="authUsername" name="username" type="text" placeholder="Nhập tên tài khoản" required autocomplete="username">

        <div id="registerFields" class="hidden">
          <label for="authEmail">Gmail</label>
          <input id="authEmail" name="email" type="email" placeholder="example@gmail.com" autocomplete="email">
        </div>

        <label for="authPassword">Mật khẩu</label>
        <input id="authPassword" name="password" type="password" placeholder="Nhập mật khẩu" required autocomplete="current-password">

        <p id="authMessage" class="message"></p>

        <button type="submit" class="primary-btn full-btn" id="authSubmitBtn">ĐĂNG NHẬP</button>
      </form>

      <div class="switch-auth">
        <span id="switchAuthText">Chưa có tài khoản?</span>
        <button type="button" id="switchAuthBtn" class="link-btn">Đăng ký</button>
      </div>
    </div>
  </div>

  <!-- TOAST THÔNG BÁO -->
  <div id="toast" class="toast"></div>

  <!-- GỌI FILE SCRIPT CHÍNH XÁC -->
  <script src="script.js"></script>
</body>
</html>
