
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEMEVERSE - Anime Meme Cards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>✨ MEMEVERSE ✨</h1>
    <p>ANIME MEME CARD ARENA</p>
  </header>

  <section id="loginScreen" class="panel">
    <h2>🌌 Cổng dịch chuyển</h2>
    <input id="username" placeholder="Tên tài khoản">
    <input id="email" type="email" placeholder="Gmail (khi đăng ký)" hidden>
    <input id="password" type="password" placeholder="Mật khẩu">
    <div class="buttons">
      <button onclick="register()">Đăng ký</button>
      <button onclick="login()">Đăng nhập</button>
    </div>
    <button class="start" onclick="login()">✦ TAP TO START ✦</button>
    <p id="message"></p>
  </section>

  <main id="gameScreen" hidden>
    <h2>Chào chiến binh <span id="player"></span>!</h2>
    <p>Mở rương, xé gói và thu thập meme huyền thoại.</p>

    <div class="game-grid">
      <article class="card-box">
        <div class="emoji">🎁</div>
        <h3>RƯƠNG BÁU</h3>
        <p>Mở rương nhận gói thẻ bí ẩn.</p>
        <button onclick="openChest()">MỞ RƯƠNG ✨</button>
      </article>

      <article class="card-box">
        <div class="emoji">🃏</div>
        <h3>GÓI THẺ MEME</h3>
        <p>Xé gói để triệu hồi nhân vật.</p>
        <button onclick="openPack()">XÉ GÓI THẺ 💥</button>
      </article>
    </div>

    <section class="panel">
      <h2>📚 Bộ sưu tập của bạn</h2>
      <p>Thẻ đã sở hữu: <strong id="count">0</strong></p>
      <div id="collection" class="collection"></div>
    </section>

    <button onclick="logout()">Đăng xuất</button>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-content">
      <button class="close" onclick="closeModal()">✕</button>
      <h2 id="modalTitle">✨ Kho báu</h2>
      <div id="modalBody"></div>
      <div id="modalButtons"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
