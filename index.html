<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadow Card - Game Thẻ Bài</title>
  <link rel="stylesheet" href="style.css?v=3">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <div class="stars-bg"></div>

  <!-- MÀN HÌNH 1: SẢNH CHỜ CHÍNH -->
  <div id="screen-main" class="game-screen">
    <div class="top-controls">
      <button class="icon-btn">🔊</button>
      <button class="icon-btn">⚙️</button>
    </div>

    <div class="logo-box">
      <h1 class="game-logo">Shadow Card</h1>
      <p class="game-subtitle">Bắt đầu hành trình của bạn</p>
    </div>

    <div class="left-menu-group">
      <button id="btn-main-login" class="menu-pill-btn">
        <span>👤</span> Đăng nhập
      </button>
      <button id="btn-main-reg" class="menu-pill-btn">
        <span>✨</span> Đăng ký
      </button>
    </div>

    <div class="center-start-box">
      <button id="btn-tap-start" class="tap-to-start-glow">
        ✦ Tap to Start ✦
      </button>
    </div>
  </div>

  <!-- MÀN HÌNH 2: ĐĂNG KÝ -->
  <div id="screen-register" class="game-screen hidden">
    <button class="back-pill-btn" id="btn-back-from-reg">←</button>
    
    <div class="auth-card glass-panel">
      <h2 class="auth-title">Đăng Ký</h2>
      <p class="auth-sub">Tạo tài khoản để bắt đầu hành trình</p>

      <form onsubmit="return false;">
        <div class="input-box">
          <span>👤</span>
          <input type="text" placeholder="Tên tài khoản (gmail)" required>
        </div>
        <div class="input-box">
          <span>🔒</span>
          <input type="password" placeholder="Mật khẩu" required>
        </div>
        <button type="submit" class="submit-action-btn">Đăng ký</button>
      </form>

      <p class="switch-prompt">Đã có tài khoản? <a href="#" id="link-reg-to-login">Đăng nhập ngay</a></p>
    </div>
  </div>

  <!-- MÀN HÌNH 3: ĐĂNG NHẬP -->
  <div id="screen-login" class="game-screen hidden">
    <button class="back-pill-btn" id="btn-back-from-login">←</button>
    
    <div class="auth-card glass-panel">
      <h2 class="auth-title">Đăng Nhập</h2>
      <p class="auth-sub">Chào mừng bạn trở lại!</p>

      <form onsubmit="return false;">
        <div class="input-box">
          <span>👤</span>
          <input type="text" placeholder="Tên tài khoản (gmail hoặc tên)" required>
        </div>
        <div class="input-box">
          <span>🔒</span>
          <input type="password" placeholder="Mật khẩu" required>
        </div>
        <button type="submit" class="submit-action-btn">Đăng nhập</button>
      </form>

      <p class="switch-prompt">Chưa có tài khoản? <a href="#" id="link-login-to-reg">Đăng ký ngay</a></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

  <script src="script.js"></script>
</body>
</html>
